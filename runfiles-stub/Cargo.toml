[package]
name = "runfiles-stub"
version = "0.1.0"
edition = "2021"

[dependencies]
# No external dependencies: the stub uses a small in-tree bump allocator
# (see src/allocator.rs) instead of a general-purpose allocator crate.

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
