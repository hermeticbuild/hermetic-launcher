[package]
name = "optimize-binary"
version = "0.1.0"
edition = "2021"

# No external dependencies: the tool only shells out to an llvm tool (objcopy)
# and copies files, so the standard library is enough. Keeping it dep-free makes
# it cheap to build as a host/exec tool in the launcher pipeline.
[dependencies]

[profile.release]
opt-level = 3
lto = true
strip = true
