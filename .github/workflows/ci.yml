name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-release-binaries:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure BuildBuddy RBE
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cat >> ~/.bazelrc << EOF
          common:cache --remote_cache=grpcs://hermetic-launcher.buildbuddy.io
          common:cache --remote_cache_compression
          common:cache --experimental_remote_downloader=grpcs://hermetic-launcher.buildbuddy.io
          common:cache --bes_results_url=https://app.buildbuddy.io/invocation/
          common:cache --bes_backend=grpcs://hermetic-launcher.buildbuddy.io
          common:cache --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}
          common:remote --config=cache
          common:remote --extra_execution_platforms=//:rbe_platform
          common:remote --remote_executor=grpcs://hermetic-launcher.buildbuddy.io
          common:remote --noexperimental_throttle_remote_action_building
          EOF
            echo "common --config=remote" >> ~/.bazelrc
          fi
      - run: bash tools/build-release-binaries.sh artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: artifacts/
          retention-days: 7

  size-report:
    name: Binary size report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Configure BuildBuddy RBE
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cat >> ~/.bazelrc << EOF
          common:cache --remote_cache=grpcs://hermetic-launcher.buildbuddy.io
          common:cache --remote_cache_compression
          common:cache --experimental_remote_downloader=grpcs://hermetic-launcher.buildbuddy.io
          common:cache --bes_results_url=https://app.buildbuddy.io/invocation/
          common:cache --bes_backend=grpcs://hermetic-launcher.buildbuddy.io
          common:cache --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}
          common:remote --config=cache
          common:remote --extra_execution_platforms=//:rbe_platform
          common:remote --remote_executor=grpcs://hermetic-launcher.buildbuddy.io
          common:remote --noexperimental_throttle_remote_action_building
          EOF
            echo "common --config=remote" >> ~/.bazelrc
          fi
      - name: Build base binaries
        run: bash tools/build-release-binaries.sh /tmp/artifacts-base
      - name: Record base sizes
        run: |
          shopt -s nullglob
          for f in /tmp/artifacts-base/runfiles-stub-* /tmp/artifacts-base/finalize-stub-*; do
            [ -f "$f" ] || continue
            printf '%s %d\n' "$(basename "$f")" "$(stat -c%s "$f")"
          done > /tmp/sizes-base.txt
          rm -rf /tmp/artifacts-base
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build PR binaries
        run: bash tools/build-release-binaries.sh /tmp/artifacts-pr
      - name: Record PR sizes
        run: |
          shopt -s nullglob
          for f in /tmp/artifacts-pr/runfiles-stub-* /tmp/artifacts-pr/finalize-stub-*; do
            [ -f "$f" ] || continue
            printf '%s %d\n' "$(basename "$f")" "$(stat -c%s "$f")"
          done > /tmp/sizes-pr.txt
          rm -rf /tmp/artifacts-pr
      - name: Generate size report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/binary-size-report.py \
            /tmp/sizes-base.txt /tmp/sizes-pr.txt \
            "$BASE_SHA" "$PR_SHA" | tee /tmp/size-report.md
          cat /tmp/size-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "Fork PR — binary size report is in the job summary above."
            exit 0
          fi
          EXISTING_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq 'map(select(.body | startswith("<!-- binary-size-report -->"))) | first | .id // empty')
          if [ -n "$EXISTING_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING_ID" \
              -X PATCH -f body="$(cat /tmp/size-report.md)"
          else
            gh pr comment "$PR_NUMBER" --body "$(cat /tmp/size-report.md)"
          fi

  test-query:
    name: Query test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bazel query --ignore_dev_dependency //launcher/...
      - run: bazel query //...

  test-linux:
    name: Test Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure BuildBuddy RBE
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cat >> ~/.bazelrc << EOF
          common:cache --remote_cache=grpcs://hermetic-launcher.buildbuddy.io
          common:cache --remote_cache_compression
          common:cache --experimental_remote_downloader=grpcs://hermetic-launcher.buildbuddy.io
          common:cache --bes_results_url=https://app.buildbuddy.io/invocation/
          common:cache --bes_backend=grpcs://hermetic-launcher.buildbuddy.io
          common:cache --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}
          common:remote --config=cache
          common:remote --extra_execution_platforms=//:rbe_platform
          common:remote --remote_executor=grpcs://hermetic-launcher.buildbuddy.io
          common:remote --noexperimental_throttle_remote_action_building
          EOF
          fi
      - env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel test ${BUILDBUDDY_API_KEY:+--config=remote} --config=release //integration-tests:integration_test
      # End-to-end launcher_binary tests, run against BOTH the prebuilt (downloaded)
      # and the source-built stubs (see //e2e). --config=release builds the
      # source-built stubs exactly as they ship.
      - env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel test ${BUILDBUDDY_API_KEY:+--config=cache} --config=release //e2e:all
      - env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel test ${BUILDBUDDY_API_KEY:+--config=cache} //...
        working-directory: e2e/bzlmod

  test-macos:
    name: Test macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [ -n "${BUILDBUDDY_API_KEY}" ]; then
            cat >> ~/.bazelrc << EOF
          common:cache --remote_cache=grpcs://hermetic-launcher.buildbuddy.io
          common:cache --remote_cache_compression
          common:cache --experimental_remote_downloader=grpcs://hermetic-launcher.buildbuddy.io
          common:cache --bes_results_url=https://app.buildbuddy.io/invocation/
          common:cache --bes_backend=grpcs://hermetic-launcher.buildbuddy.io
          common:cache --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}
          EOF
          fi
      - env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel test ${BUILDBUDDY_API_KEY:+--config=cache} --config=release //integration-tests:integration_test
      # The same suite against the x86_64 stub, which this Apple silicon runner
      # executes under Rosetta. A register the kernel clobbers is only caught on the
      # arch whose register allocation parks a live value in it, so the host-arch run
      # above cannot see it (see integration-tests/BUILD.bazel). Idempotent: exits 0
      # when Rosetta is already present.
      - run: sudo softwareupdate --install-rosetta --agree-to-license
      - env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel test ${BUILDBUDDY_API_KEY:+--config=cache} --config=release //integration-tests:integration_test_x86_64_macos
      # End-to-end launcher_binary tests, run against BOTH the prebuilt (downloaded)
      # and the source-built stubs (see //e2e). --config=release builds the
      # source-built stubs exactly as they ship.
      - env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel test ${BUILDBUDDY_API_KEY:+--config=cache} --config=release //e2e:all
      - env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: bazel test ${BUILDBUDDY_API_KEY:+--config=cache} //...
        working-directory: e2e/bzlmod

  test-windows:
    name: Test Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure BuildBuddy remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if ($env:BUILDBUDDY_API_KEY) {
            $lines = @(
              "common:cache --remote_cache=grpcs://hermetic-launcher.buildbuddy.io",
              "common:cache --remote_cache_compression",
              "common:cache --experimental_remote_downloader=grpcs://hermetic-launcher.buildbuddy.io",
              "common:cache --bes_results_url=https://app.buildbuddy.io/invocation/",
              "common:cache --bes_backend=grpcs://hermetic-launcher.buildbuddy.io",
              "common:cache --remote_header=x-buildbuddy-api-key=$env:BUILDBUDDY_API_KEY"
            )
            Add-Content "$env:USERPROFILE\.bazelrc" $lines
          }
      - env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          $config = if ($env:BUILDBUDDY_API_KEY) { "--config=cache" } else { $null }
          bazel --output_user_root=C:/b test $config --config=release --test_output=errors //integration-tests:integration_test
      # End-to-end launcher_binary tests, run against BOTH the prebuilt (downloaded)
      # and the source-built stubs (see //e2e). --config=release builds the
      # source-built stubs exactly as they ship.
      - env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          $config = if ($env:BUILDBUDDY_API_KEY) { "--config=cache" } else { $null }
          bazel --output_user_root=C:/b test $config --config=release --test_output=errors //e2e:all
      - env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          $config = if ($env:BUILDBUDDY_API_KEY) { "--config=cache" } else { $null }
          bazel test $config //...
        working-directory: e2e/bzlmod
